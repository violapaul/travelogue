[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelogue"
version = "0.1.0"
description = "Compile photo exports and markdown journals into a private, map-rich static travelogue"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "Pillow>=10.3",
    "pillow-heif>=0.16",
    "imagehash>=4.3",
    "exifread>=3.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "reverse_geocoder>=1.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "hdbscan>=0.8",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
travelogue = "travelogue.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelogue"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
