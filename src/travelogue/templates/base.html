<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ trip_title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base }}static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="site-nav">
    <a class="nav-home" href="{{ base }}index.html">{{ trip_title }}</a>
    <div class="nav-links">
      <a href="{{ base }}story.html">Story</a>
      <a href="{{ base }}map.html">Map</a>
      <a href="{{ base }}everything.html">Everything</a>
      <a href="{{ base }}slideshow.html">Slideshow</a>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <p>{{ trip_title }} &middot; {{ total_assets }} photos</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
